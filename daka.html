<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族运动打卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f6f7f9;padding:16px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.title{text-align:center;font-size:20px;font-weight:600;margin:16px 0;color:#222}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:12px;background:#f1f1f1;text-align:center;font-size:14px}
.tab.active{background:#4e8dff;color:white}
.input{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:12px;margin-top:8px;font-size:16px}
.btn{width:100%;padding:14px;background:#4e8dff;color:white;border:none;border-radius:12px;margin-top:12px;font-size:16px;font-weight:500}
.btn:active{opacity:.9}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f3f3;font-size:15px}
.row:last-child{border-bottom:none}
.label{color:#555}
.value{font-weight:600;color:#222}
.fine{color:#ff5252}
.success{color:#4caf50}
.select{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:12px;margin-top:8px;font-size:16px;background:white}
</style>
</head>
<body>
<div class="title">🏃 家族运动打卡</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('home')">打卡</div>
<div class="tab" onclick="switchTab('stats')">统计</div>
</div>

<div id="home" style="display:block">
<div class="card">
<select class="select" id="member">
<option value="凡">凡</option>
<option value="婉玲">婉玲</option>
<option value="芷琪">芷琪</option>
</select>
<input class="input" id="steps" placeholder="输入步数" type="number">
<input class="input" id="cal" placeholder="输入卡路里" type="number">
<button class="btn" onclick="submitCheckin()">提交打卡</button>
</div>
</div>

<div id="stats" style="display:none">
<div class="card" id="statsContainer"></div>
</div>

<script>
// 基准日期：2026年3月16日（打卡第一天）
const BASE = new Date("2026-03-16");
const DB_ID = "family_sport_2026";

// 获取当前周的7天日期（从3月16日每7天重置）
function getWeekDates() {
    const now = new Date();
    const days = Math.floor((now - BASE) / 86400000);
    const weekStart = new Date(BASE);
    weekStart.setDate(BASE.getDate() + Math.floor(days / 7) * 7);
    const arr = [];
    for (let i=0;i<7;i++) {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate()+i);
        arr.push(d.toISOString().split("T")[0]);
    }
    return arr;
}

// 新罚款规则：≤2天未打卡不扣钱，≥3天（含）开始双倍罚款（50元/天×2）
function calcFine(uncheck) {
    if (uncheck <= 2) return 0; // ≤2天不扣钱
    return 100 * (uncheck - 2); // ≥3天，每少1天罚100元（双倍）
}

// 从云端加载全家打卡数据
async function loadData() {
    try {
        const res = await fetch(`https://api.dbhub.io/v1/query?dbname=free-public-share/${DB_ID}.db&sql=select+*+from+checkin`);
        const j = await res.json();
        const map = {};
        j.forEach(row=>{
            if (!map[row.name]) map[row.name]={};
            map[row.name][row.day]={steps:row.steps,cal:row.cal};
        });
        return map;
    }catch(e){
        return {};
    }
}

// 提交打卡数据到云端（全家同步）
async function saveOne(name,day,steps,cal) {
    await fetch(`https://api.dbhub.io/v1/exec`,{
        method:"POST",
        body:JSON.stringify({
            dbname:`free-public-share/${DB_ID}.db`,
            sql:`insert or replace into checkin (name,day,steps,cal) values ('${name}','${day}',${steps},${cal})`
        })
    });
}

// 提交打卡逻辑
async function submitCheckin() {
    const m=document.getElementById("member").value;
    const s=parseInt(document.getElementById("steps").value)||0;
    const c=parseInt(document.getElementById("cal").value)||0;
    if (s<=0||c<=0) {alert("请输入有效数据");return;}
    const today = new Date().toISOString().split("T")[0];
    await saveOne(m,today,s,c);
    
    // 俏皮提醒文案
    const dates = getWeekDates();
    const data = await loadData();
    const userData = data[m] || {};
    let checkinCount = 0;
    dates.forEach(d => {if(userData[d]) checkinCount++;});
    const uncheck = 7 - checkinCount;
    
    let remindText = "✅ 打卡成功！全家已同步～";
    if (uncheck === 3) {
        remindText = "😜 打卡成功！不过本周已经3天没打卡咯，罚款要开始翻倍啦～";
    } else if (uncheck > 3) {
        remindText = `🤭 打卡成功！本周已经${uncheck}天没打卡，罚款已翻倍${uncheck-2}天咯～`;
    }
    alert(remindText);

    document.getElementById("steps").value="";
    document.getElementById("cal").value="";
    renderStats();
}

// 渲染全家统计数据
async function renderStats() {
    const dates=getWeekDates();
    const data=await loadData();
    const members=["凡","婉玲","芷琪"];
    let html="";
    members.forEach(name=>{
        const user=data[name]||{};
        let cnt=0;
        let totalSteps=0,totalCal=0;
        dates.forEach(d=>{
            if (user[d]) {cnt++;totalSteps+=user[d].steps;totalCal+=user[d].cal;}
        });
        const uncheck=7-cnt;
        const fine=calcFine(uncheck);
        html+=`<div class="card">`;
        html+=`<div style="font-weight:600;margin-bottom:8px">${name}</div>`;
        html+=`<div class="row"><span class="label">本周已打卡</span><span class="value success">${cnt}天</span></div>`;
        html+=`<div class="row"><span class="label">未打卡</span><span class="value">${uncheck}天</span></div>`;
        html+=`<div class="row"><span class="label">本周罚款</span><span class="value fine">¥${fine}</span></div>`;
        html+=`<div class="row"><span class="label">总步数</span><span class="value">${totalSteps}</span></div>`;
        html+=`<div class="row"><span class="label">总卡路里</span><span class="value">${totalCal}</span></div>`;
        html+=`</div>`;
    });
    document.getElementById("statsContainer").innerHTML=html;
}

// 切换打卡/统计标签页
function switchTab(t) {
    document.getElementById("home").style.display="none";
    document.getElementById("stats").style.display="none";
    document.querySelectorAll(".tab").forEach(tab=>tab.classList.remove("active"));
    document.getElementById(t).style.display="block";
    document.querySelector(`.tab:nth-child(${t==='home'?1:2})`).classList.add("active");
    if (t==='stats') renderStats();
}

// 页面加载时自动渲染统计数据
window.onload=()=>{renderStats()};
</script>
</body>
</html>
