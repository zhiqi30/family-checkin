<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族运动打卡系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微软雅黑', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }
        
        .tab-container {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #7f8c8d;
            font-weight: 600;
        }
        
        .tab.active {
            border-bottom-color: #3498db;
            color: #3498db;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .upload-area {
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #3498db;
            background-color: #f8f9fa;
        }
        
        .upload-area i {
            font-size: 40px;
            color: #7f8c8d;
            margin-bottom: 10px;
            display: block;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .summary-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .summary-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #34495e;
        }
        
        .stat-value {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .fine {
            color: #e74c3c;
        }
        
        .success {
            color: #27ae60;
        }
        
        #preview-image {
            max-width: 100%;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        
        .member-setting {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .week-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .week-btn {
            padding: 8px 15px;
            background-color: #eee;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
        }
        
        .week-btn.active {
            background-color: #3498db;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>🏃 家族运动打卡系统</h1>
        
        <div class="tab-container">
            <div class="tab active" data-tab="checkin">每日打卡</div>
            <div class="tab" data-tab="settings">目标设置</div>
            <div class="tab" data-tab="overview">打卡概览</div>
            <div class="tab" data-tab="weekly">周总结</div>
        </div>
        
        <!-- 每日打卡 Tab -->
        <div class="tab-content active" id="checkin">
            <div class="form-group">
                <label for="member">选择成员</label>
                <select id="member">
                    <option value="member1">成员1</option>
                    <option value="member2">成员2</option>
                    <option value="member3">成员3</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>上传运动截图</label>
                <div class="upload-area" id="upload-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>点击或拖拽图片到此处上传</p>
                    <input type="file" id="image-upload" accept="image/*" style="display: none;">
                </div>
                <img id="preview-image" alt="预览图片">
            </div>
            
            <div class="form-group">
                <label for="steps">步数 (自动识别)</label>
                <input type="number" id="steps" placeholder="自动识别或手动输入">
            </div>
            
            <div class="form-group">
                <label for="calories">消耗卡路里 (自动识别)</label>
                <input type="number" id="calories" placeholder="自动识别或手动输入">
            </div>
            
            <button id="submit-checkin">提交打卡</button>
        </div>
        
        <!-- 目标设置 Tab -->
        <div class="tab-content" id="settings">
            <div class="member-setting">
                <h3>成员1 目标设置</h3>
                <div class="form-group">
                    <label for="member1-steps">每日步数目标</label>
                    <input type="number" id="member1-steps" placeholder="例如：4000" value="4000">
                </div>
                <div class="form-group">
                    <label for="member1-calories">每日卡路里目标</label>
                    <input type="number" id="member1-calories" placeholder="例如：350" value="350">
                </div>
            </div>
            
            <div class="member-setting">
                <h3>成员2 目标设置</h3>
                <div class="form-group">
                    <label for="member2-steps">每日步数目标</label>
                    <input type="number" id="member2-steps" placeholder="例如：4000" value="4000">
                </div>
                <div class="form-group">
                    <label for="member2-calories">每日卡路里目标</label>
                    <input type="number" id="member2-calories" placeholder="例如：350" value="350">
                </div>
            </div>
            
            <div class="member-setting">
                <h3>成员3 目标设置</h3>
                <div class="form-group">
                    <label for="member3-steps">每日步数目标</label>
                    <input type="number" id="member3-steps" placeholder="例如：4000" value="4000">
                </div>
                <div class="form-group">
                    <label for="member3-calories">每日卡路里目标</label>
                    <input type="number" id="member3-calories" placeholder="例如：350" value="300">
                </div>
            </div>
            
            <button id="save-settings">保存目标设置</button>
        </div>
        
        <!-- 打卡概览 Tab -->
        <div class="tab-content" id="overview">
            <div class="week-selector">
                <button class="week-btn active" data-week="current">本周</button>
                <button class="week-btn" data-week="last">上周</button>
            </div>
            
            <div class="summary-card">
                <h3>成员1 打卡情况</h3>
                <div class="stat-item">
                    <span class="stat-label">已打卡天数</span>
                    <span class="stat-value" id="member1-checkin-days">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">未打卡天数</span>
                    <span class="stat-value fine" id="member1-uncheckin-days">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">累计罚款</span>
                    <span class="stat-value fine" id="member1-fine">¥0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总步数</span>
                    <span class="stat-value" id="member1-total-steps">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总卡路里</span>
                    <span class="stat-value" id="member1-total-calories">0</span>
                </div>
            </div>
            
            <div class="summary-card">
                <h3>成员2 打卡情况</h3>
                <div class="stat-item">
                    <span class="stat-label">已打卡天数</span>
                    <span class="stat-value" id="member2-checkin-days">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">未打卡天数</span>
                    <span class="stat-value fine" id="member2-uncheckin-days">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">累计罚款</span>
                    <span class="stat-value fine" id="member2-fine">¥0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总步数</span>
                    <span class="stat-value" id="member2-total-steps">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总卡路里</span>
                    <span class="stat-value" id="member2-total-calories">0</span>
                </div>
            </div>
            
            <div class="summary-card">
                <h3>成员3 打卡情况</h3>
                <div class="stat-item">
                    <span class="stat-label">已打卡天数</span>
                    <span class="stat-value" id="member3-checkin-days">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">未打卡天数</span>
                    <span class="stat-value fine" id="member3-uncheckin-days">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">累计罚款</span>
                    <span class="stat-value fine" id="member3-fine">¥0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总步数</span>
                    <span class="stat-value" id="member3-total-steps">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总卡路里</span>
                    <span class="stat-value" id="member3-total-calories">0</span>
                </div>
            </div>
        </div>
        
        <!-- 周总结 Tab -->
        <div class="tab-content" id="weekly">
            <div class="week-selector">
                <button class="week-btn active" data-week="current">本周</button>
                <button class="week-btn" data-week="last">上周</button>
            </div>
            
            <div class="summary-card">
                <h3>📊 本周运动总结</h3>
                <div class="stat-item">
                    <span class="stat-label">家族总步数</span>
                    <span class="stat-value" id="total-family-steps">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">家族总卡路里</span>
                    <span class="stat-value" id="total-family-calories">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总未打卡次数</span>
                    <span class="stat-value fine" id="total-uncheckin">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总罚款金额</span>
                    <span class="stat-value fine" id="total-fine">¥0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">步数冠军</span>
                    <span class="stat-value success" id="steps-champion">暂无</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">卡路里冠军</span>
                    <span class="stat-value success" id="calories-champion">暂无</span>
                </div>
            </div>
            
            <button id="export-summary">导出周总结</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentWeek = 'current';
        let checkinData = JSON.parse(localStorage.getItem('familyCheckinData')) || {
            current: { member1: {}, member2: {}, member3: {} },
            last: { member1: {}, member2: {}, member3: {} }
        };
        let targetSettings = JSON.parse(localStorage.getItem('targetSettings')) || {
            member1: { steps: 4000, calories: 350 },
            member2: { steps: 4000, calories: 350 },
            member3: { steps: 4000, calories: 300 }
        };
        
        // DOM加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化标签切换
            initTabs();
            
            // 初始化上传区域
            initUploadArea();
            
            // 绑定按钮事件
            bindEvents();
            
            // 初始化设置表单
            initSettingsForm();
            
            // 更新概览数据
            updateOverview();
            
            // 更新周总结
            updateWeeklySummary();
        });
        
        // 初始化标签切换
        function initTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    // 移除所有active类
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    // 添加active类到当前标签
                    this.classList.add('active');
                    const tabId = this.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }
        
        // 初始化上传区域
        function initUploadArea() {
            const uploadArea = document.getElementById('upload-area');
            const imageUpload = document.getElementById('image-upload');
            const previewImage = document.getElementById('preview-image');
            
            // 点击上传区域触发文件选择
            uploadArea.addEventListener('click', () => {
                imageUpload.click();
            });
            
            // 文件选择后处理
            imageUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        previewImage.src = event.target.result;
                        previewImage.style.display = 'block';
                        
                        // 模拟图片识别（实际项目中可接入OCR API）
                        simulateImageRecognition();
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // 拖拽上传
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#3498db';
                uploadArea.style.backgroundColor = '#f8f9fa';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#bdc3c7';
                uploadArea.style.backgroundColor = 'white';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#bdc3c7';
                uploadArea.style.backgroundColor = 'white';
                
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        previewImage.src = event.target.result;
                        previewImage.style.display = 'block';
                        simulateImageRecognition();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        
        // 模拟图片识别（实际使用时可替换为真实OCR接口）
        function simulateImageRecognition() {
            // 随机生成合理的步数和卡路里值（模拟识别结果）
            const randomSteps = Math.floor(Math.random() * 8000) + 2000;
            const randomCalories = Math.floor(Math.random() * 300) + 200;
            
            document.getElementById('steps').value = randomSteps;
            document.getElementById('calories').value = randomCalories;
            
            alert('✅ 图片识别完成，已自动填充步数和卡路里数据！');
        }
        
        // 绑定按钮事件
        function bindEvents() {
            // 提交打卡
            document.getElementById('submit-checkin').addEventListener('click', submitCheckin);
            
            // 保存设置
            document.getElementById('save-settings').addEventListener('click', saveSettings);
            
            // 导出总结
            document.getElementById('export-summary').addEventListener('click', exportSummary);
            
            // 周选择器
            document.querySelectorAll('.week-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const week = this.getAttribute('data-week');
                    currentWeek = week;
                    
                    // 更新按钮状态
                    this.parentElement.querySelectorAll('.week-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    // 更新数据
                    updateOverview();
                    updateWeeklySummary();
                });
            });
        }
        
        // 初始化设置表单
        function initSettingsForm() {
            document.getElementById('member1-steps').value = targetSettings.member1.steps;
            document.getElementById('member1-calories').value = targetSettings.member1.calories;
            document.getElementById('member2-steps').value = targetSettings.member2.steps;
            document.getElementById('member2-calories').value = targetSettings.member2.calories;
            document.getElementById('member3-steps').value = targetSettings.member3.steps;
            document.getElementById('member3-calories').value = targetSettings.member3.calories;
        }
        
        // 提交打卡
        function submitCheckin() {
            const member = document.getElementById('member').value;
            const steps = parseInt(document.getElementById('steps').value) || 0;
            const calories = parseInt(document.getElementById('calories').value) || 0;
            
            if (steps <= 0 || calories <= 0) {
                alert('请输入有效的步数和卡路里数值！');
                return;
            }
            
            // 获取当前日期
            const today = new Date();
            const dateKey = today.toISOString().split('T')[0]; // YYYY-MM-DD
            
            // 保存打卡数据
            if (!checkinData[currentWeek][member]) {
                checkinData[currentWeek][member] = {};
            }
            checkinData[currentWeek][member][dateKey] = {
                steps: steps,
                calories: calories,
                timestamp: Date.now()
            };
            
            // 保存到本地存储
            localStorage.setItem('familyCheckinData', JSON.stringify(checkinData));
            
            alert(`✅ ${member.replace('member', '成员')} 打卡成功！`);
            
            // 清空表单
            document.getElementById('steps').value = '';
            document.getElementById('calories').value = '';
            document.getElementById('preview-image').style.display = 'none';
            document.getElementById('image-upload').value = '';
            
            // 更新概览
            updateOverview();
            updateWeeklySummary();
        }
        
        // 保存设置
        function saveSettings() {
            targetSettings = {
                member1: {
                    steps: parseInt(document.getElementById('member1-steps').value) || 4000,
                    calories: parseInt(document.getElementById('member1-calories').value) || 350
                },
                member2: {
                    steps: parseInt(document.getElementById('member2-steps').value) || 4000,
                    calories: parseInt(document.getElementById('member2-calories').value) || 350
                },
                member3: {
                    steps: parseInt(document.getElementById('member3-steps').value) || 4000,
                    calories: parseInt(document.getElementById('member3-calories').value) || 300
                }
            };
            
            // 保存到本地存储
            localStorage.setItem('targetSettings', JSON.stringify(targetSettings));
            
            alert('✅ 目标设置保存成功！');
        }
        
        // 更新概览数据
        function updateOverview() {
            // 获取本周日期范围
            const weekDates = getWeekDates(currentWeek);
            
            // 遍历每个成员
            ['member1', 'member2', 'member3'].forEach(member => {
                let checkinDays = 0;
                let totalSteps = 0;
                let totalCalories = 0;
                
                // 统计打卡数据
                const memberData = checkinData[currentWeek][member] || {};
                weekDates.forEach(date => {
                    if (memberData[date]) {
                        checkinDays++;
                        totalSteps += memberData[date].steps;
                        totalCalories += memberData[date].calories;
                    }
                });
                
                // 计算未打卡天数和罚款
                const uncheckinDays = 7 - checkinDays;
                const fine = uncheckinDays * 50;
                
                // 更新DOM
                document.getElementById(`${member}-checkin-days`).textContent = checkinDays;
                document.getElementById(`${member}-uncheckin-days`).textContent = uncheckinDays;
                document.getElementById(`${member}-fine`).textContent = `¥${fine}`;
                document.getElementById(`${member}-total-steps`).textContent = totalSteps;
                document.getElementById(`${member}-total-calories`).textContent = totalCalories;
            });
        }
        
        // 更新周总结
        function updateWeeklySummary() {
            let totalFamilySteps = 0;
            let totalFamilyCalories = 0;
            let totalUncheckin = 0;
            let memberSteps = { member1: 0, member2: 0, member3: 0 };
            let memberCalories = { member1: 0, member2: 0, member3: 0 };
            
            // 统计所有成员数据
            ['member1', 'member2', 'member3'].forEach(member => {
                const memberData = checkinData[currentWeek][member] || {};
                let checkinDays = 0;
                
                // 累加步数和卡路里
                Object.values(memberData).forEach(dayData => {
                    checkinDays++;
                    memberSteps[member] += dayData.steps;
                    memberCalories[member] += dayData.calories;
                });
                
                // 累计未打卡次数
                totalUncheckin += 7 - checkinDays;
                
                // 累加到家族总数
                totalFamilySteps += memberSteps[member];
                totalFamilyCalories += memberCalories[member];
            });
            
            // 计算总罚款
            const totalFine = totalUncheckin * 50;
            
            // 找出步数和卡路里冠军
            const stepsChampion = Object.keys(memberSteps).reduce((a, b) => 
                memberSteps[a] > memberSteps[b] ? a : b).replace('member', '成员');
            const caloriesChampion = Object.keys(memberCalories).reduce((a, b) => 
                memberCalories[a] > memberCalories[b] ? a : b).replace('member', '成员');
            
            // 更新DOM
            document.getElementById('total-family-steps').textContent = totalFamilySteps;
            document.getElementById('total-family-calories').textContent = totalFamilyCalories;
            document.getElementById('total-uncheckin').textContent = totalUncheckin;
            document.getElementById('total-fine').textContent = `¥${totalFine}`;
            document.getElementById('steps-champion').textContent = stepsChampion;
            document.getElementById('calories-champion').textContent = caloriesChampion;
        }
        
        // 导出总结
        function exportSummary() {
            const weekLabel = currentWeek === 'current' ? '本周' : '上周';
            const summaryDate = new Date().toLocaleDateString();
            
            // 构建总结文本
            let summaryText = `🏆 ${weekLabel}家族运动打卡总结 (${summaryDate})\n\n`;
            
            ['member1', 'member2', 'member3'].forEach(member => {
                const checkinDays = document.getElementById(`${member}-checkin-days`).textContent;
                const uncheckinDays = document.getElementById(`${member}-uncheckin-days`).textContent;
                const fine = document.getElementById(`${member}-fine`).textContent;
                const totalSteps = document.getElementById(`${member}-total-steps`).textContent;
                const totalCalories = document.getElementById(`${member}-total-calories`).textContent;
                
                summaryText += `${member.replace('member', '成员')}：
- 打卡天数：${checkinDays}天
- 未打卡天数：${uncheckinDays}天
- 罚款金额：${fine}
- 总步数：${totalSteps}步
- 总卡路里：${totalCalories}千卡

`;
            });
            
            summaryText += `📊 家族总计：
- 总步数：${document.getElementById('total-family-steps').textContent}步
- 总卡路里：${document.getElementById('total-family-calories').textContent}千卡
- 总未打卡次数：${document.getElementById('total-uncheckin').textContent}次
- 总罚款金额：${document.getElementById('total-fine').textContent}
- 步数冠军：${document.getElementById('steps-champion').textContent}
- 卡路里冠军：${document.getElementById('calories-champion').textContent}
`;
            
            // 创建下载链接
            const blob = new Blob([summaryText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${weekLabel}家族运动打卡总结.txt`;
            a.click();
            
            // 释放URL对象
            URL.revokeObjectURL(url);
            
            alert('📤 周总结已成功导出！');
        }
        
        // 获取本周/上周的日期数组 (YYYY-MM-DD格式)
        function getWeekDates(type) {
            const dates = [];
            const today = new Date();
            const day = today.getDay() || 7; // 转换为周日=7
            
            // 计算本周一的日期
            let monday = new Date(today);
            monday.setDate(today.getDate() - day + 1);
            
            // 如果是上周，减去7天
            if (type === 'last') {
                monday.setDate(monday.getDate() - 7);
            }
            
            // 生成一周的日期
            for (let i = 0; i < 7; i++) {
                const date = new Date(monday);
                date.setDate(monday.getDate() + i);
                dates.push(date.toISOString().split('T')[0]);
            }
            
            return dates;
        }
    </script>
